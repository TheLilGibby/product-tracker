version: '3.8'

services:
  app-tracker:
    build: .
    container_name: app-tracker
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - DATABASE_URI=sqlite:///data/product_tracker.db
      - DEBUG=${DEBUG:-0}
      - TWOCAPTCHA_API_KEY=${TWOCAPTCHA_API_KEY:-34c6d7576786cffd62e7483403ff6fd1}
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-15}
      - CHECK_INTERVAL_SECONDS=${CHECK_INTERVAL_SECONDS:-0}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/ || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

volumes:
  app_data:
    driver: local
  app_logs:
    driver: local 